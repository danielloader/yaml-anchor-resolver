name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build VSIX
        run: npx @vscode/vsce package --out yaml-anchor-resolver-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "yaml-anchor-resolver-${{ github.ref_name }}.vsix" \
            --title "${{ github.ref_name }}" \
            --generate-notes
